name: xnvme-fs

on:
  push:
    branches: [main]
    paths: ["adapters/**", "cijoe/**", "include/**", "lib/**", "systemd/**", "tests/**", "tools/**", "subprojects/**", "meson.build",
            "meson_options.txt", ".github/workflows/xnvme-fs.yml", "REUSE.toml", "LICENSES/**", ".gitmodules"]
  pull_request:
    paths: ["adapters/**", "cijoe/**", "include/**", "lib/**", "systemd/**", "tests/**", "tools/**", "subprojects/**", "meson.build",
            "meson_options.txt", ".github/workflows/xnvme-fs.yml", "REUSE.toml", "LICENSES/**", ".gitmodules"]
  workflow_dispatch:

# XNVME_REPOSITORY and XNVME_REF name the xNVMe that xnvme fs builds against and installs its extension into; no
# other file names them. The branch api-pass of safl/xnvme adds to xNVMe's main the commit "feat(cli): let other
# projects extend the commands of xnvme", and the spec headers and command preps that lib/layout.cpp uses.
env:
  XNVME_REPOSITORY: safl/xnvme
  XNVME_REF: api-pass

jobs:
  # A pull request restores only its own caches and those of main, so the run on a push to main builds and saves
  # the cache that pull requests restore. The guest suites run on pull requests and by hand only, since main moves
  # only by fast-forward to a commit that a pull request tested.
  build-and-test:
    runs-on: ubuntu-26.04
    env:
      XNVME_FS_XNVME: ${{ github.workspace }}/xnvme
      XNVME_FS_TREE: /mnt/xnvme-fs/tree
      XNVME_FS_GUEST_ROOT: /mnt/xnvme-fs/guest
      XNVME_FS_CCACHE: ${{ github.workspace }}/.ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The build takes DuckDB's version from git describe, which needs the tags of the submodules
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.XNVME_REPOSITORY }}
          ref: ${{ env.XNVME_REF }}
          path: xnvme
      - name: Install packages
        run: sudo adapters/scripts/ci-deps.sh
      # DuckDB is most of the build. The last step saves the cache even when a test fails.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      # The DuckDB and RocksDB builds, the guest image and the guest's two sparse 8 GiB drives need room. The step
      # removes the toolchains and images preinstalled on the runner that the job does not use, and creates
      # /mnt/xnvme-fs, since /mnt has room.
      - name: Free room on the runner, and prepare KVM, QEMU and cijoe for the guest
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/microsoft /opt/google /opt/az
          sudo docker system prune -a -f > /dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          pipx install cijoe==0.9.70
          sudo mkdir -p /mnt/xnvme-fs
          sudo chown "$USER" /mnt/xnvme-fs
          df -h / /mnt
      # The runner has no oras, which fetches the guest's disk image and which the deps step of the build workflow
      # checks for
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.5
      - name: Build xNVMe, xnvme fs and the adapters
        working-directory: cijoe
        run: |
          ccache -z
          cijoe workflows/xnvme-fs-build.yaml -c configs/local.toml -o /mnt/xnvme-fs/cijoe-output-build --skip-report
          ccache -s
      # These tests need no controller: the exports of libxnvme-fs, the systemd unit, and the extension run through
      # 'xnvme'. -Dsystemd_unitdir names the unit directory, so meson builds and checks the unit without the
      # pkg-config file of systemd.
      - name: Build xnvme fs with its test programs and run meson test
        run: |
          export PKG_CONFIG_PATH=$(dirname $(find $XNVME_FS_TREE/prefix -name xnvme.pc))
          meson setup /mnt/xnvme-fs/build-fs . --prefix $XNVME_FS_TREE/prefix -Dsystemd_unitdir=/usr/lib/systemd/system -Ddmabuf=enabled
          meson test -C /mnt/xnvme-fs/build-fs --print-errorlogs
      # The suites of the file system itself, cijoe/tests/test_fs.py, need four controllers and root in the guest;
      # this job does not run them
      - name: Run the test suites in the QEMU guest
        if: github.event_name != 'push'
        working-directory: cijoe
        run: cijoe workflows/xnvme-fs-guest.yaml -c configs/qemu-guest.toml -o /mnt/xnvme-fs/cijoe-output --skip-report
      # The suites can fill the runner's disk through the sparse images of the guest's drives
      - if: always() && github.event_name != 'push'
        name: Show the runner's free space and the guest drives' allocation
        run: |
          df -h / /mnt
          du -h /mnt/xnvme-fs/guest/xnvme_fs/*.img || true
      - if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cijoe-output-guest
          path: |
            /mnt/xnvme-fs/cijoe-output-build
            /mnt/xnvme-fs/cijoe-output
            /mnt/xnvme-fs/guest/xnvme_fs/serial.output
          if-no-files-found: ignore
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: REUSE
        uses: fsfe/reuse-action@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
      # required-version in cijoe/ruff.toml is this version
      - name: ruff on the cijoe scripts
        run: |
          pip install ruff==0.17.3
          ruff check cijoe
