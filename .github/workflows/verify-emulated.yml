name: verify-emulated

# Called by 'verify'. The job builds xNVMe, xnvme fs and the adapters in a container of BUILD_IMAGE, and runs the
# adapters' test suites in the guest of xnvme-devenv, which a container of DEVENV_IMAGE boots with the rig of
# cijoe/configs/qemu-guest.toml. Both containers mount the workspace and /mnt/xnvme-fs at the paths these have on
# the runner, so the second container finds the build tree where the first wrote it. The build and the suites are
# one job, since the build tree is several GB.
on:
  workflow_call:
    inputs:
      suites:
        description: Whether the test suites run in the guest after the build
        type: boolean
        required: true

defaults:
  run:
    shell: bash

# XNVME_REPOSITORY and XNVME_REF name the xNVMe that xnvme fs builds against and installs its extension into; no
# other file names them. The branch api-pass of safl/xnvme adds to xNVMe's main the commit "feat(cli): let other
# projects extend the commands of xnvme", and the spec headers and command preps that lib/layout.cpp uses.
# BUILD_IMAGE is xNVMe's image with its dependencies for Ubuntu 26.04. DEVENV_IMAGE is the host container of the
# xnvme-devenv release that xNVMe v0.8.0 pins.
env:
  XNVME_REPOSITORY: safl/xnvme
  XNVME_REF: api-pass
  BUILD_IMAGE: ghcr.io/xnvme/xnvme/distro-deps-ubuntu-resolute:main
  DEVENV_IMAGE: ghcr.io/xnvme/xnvme-devenv/host:v0.15.0

jobs:
  # A pull request restores only its own caches and those of main, so the run on a push to main builds and saves
  # the cache that pull requests restore
  verify:
    runs-on: ubuntu-26.04
    env:
      XNVME_FS_XNVME: ${{ github.workspace }}/xnvme
      XNVME_FS_TREE: /mnt/xnvme-fs/tree
      XNVME_FS_GUEST_ROOT: /mnt/xnvme-fs/guest
      XNVME_FS_CCACHE: ${{ github.workspace }}/.ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: "true"
      RUN: >-
        docker run --rm -v /mnt/xnvme-fs:/mnt/xnvme-fs -v ${{ github.workspace }}:${{ github.workspace }}
        -e XNVME_FS_XNVME -e XNVME_FS_TREE -e XNVME_FS_GUEST_ROOT -e XNVME_FS_CCACHE -e CCACHE_DIR -e CCACHE_MAXSIZE
        -e CCACHE_COMPRESS
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The build takes DuckDB's version from git describe, which needs the tags of the submodules
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.XNVME_REPOSITORY }}
          ref: ${{ env.XNVME_REF }}
          path: xnvme
      # DuckDB is most of the build. The last step saves the cache even when a test fails.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      # The DuckDB and RocksDB builds, the two container images, the guest image and the guest's two sparse 8 GiB
      # drives need room. The step removes the toolchains and images preinstalled on the runner that the job does not
      # use, and creates /mnt/xnvme-fs, since /mnt has room.
      - name: Free room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/microsoft /opt/google /opt/az
          sudo docker system prune -a -f > /dev/null || true
          sudo mkdir -p /mnt/xnvme-fs
          df -h / /mnt
      # BUILD_IMAGE has xNVMe's dependencies; ci-deps.sh adds cmake, ccache and gflags, which the adapters need. The
      # runner's user owns the checkouts and the container runs as root. git exits with "detected dubious ownership"
      # for a repository that another user owns, unless safe.directory names it.
      - name: Build xNVMe, xnvme fs and the adapters
        run: |
          $RUN -w "$GITHUB_WORKSPACE" "$BUILD_IMAGE" bash -euc '
            git config --global --add safe.directory "*"
            adapters/scripts/ci-deps.sh
            pipx install cijoe==0.9.70
            export PATH="$HOME/.local/bin:$PATH"
            cd cijoe
            ccache -z
            cijoe workflows/xnvme-fs-build.yaml -c configs/local.toml -o /mnt/xnvme-fs/cijoe-output-build --skip-report
            ccache -s'
      # These tests need no controller: the exports of libxnvme-fs, the systemd unit, and the extension run through
      # 'xnvme'. -Dsystemd_unitdir names the unit directory, so meson builds and checks the unit without the
      # pkg-config file of systemd.
      - name: Build xnvme fs with its test programs and run meson test
        run: |
          $RUN -w "$GITHUB_WORKSPACE" "$BUILD_IMAGE" bash -euc '
            git config --global --add safe.directory "*"
            export PKG_CONFIG_PATH=$(dirname $(find $XNVME_FS_TREE/prefix -name xnvme.pc))
            meson setup /mnt/xnvme-fs/build-fs . --prefix $XNVME_FS_TREE/prefix \
              -Dsystemd_unitdir=/usr/lib/systemd/system -Ddmabuf=enabled
            meson test -C /mnt/xnvme-fs/build-fs --print-errorlogs'
      # The suites of the file system itself, cijoe/tests/test_fs.py, need four controllers and root in the guest;
      # this job does not run them
      - name: Run the test suites in xnvme-devenv's guest
        if: inputs.suites
        run: >-
          $RUN --privileged -w "$GITHUB_WORKSPACE/cijoe" "$DEVENV_IMAGE"
          cijoe workflows/xnvme-fs-guest.yaml -c configs/qemu-guest.toml -o /mnt/xnvme-fs/cijoe-output --skip-report
      # The containers run as root, and QEMU creates the guest's serial log readable by root only. The upload step
      # runs as the runner's user.
      - if: always() && inputs.suites
        name: Give the runner's user what the containers wrote
        run: sudo chown -R "$(id -u):$(id -g)" /mnt/xnvme-fs
      # The suites can fill the runner's disk through the sparse images of the guest's drives
      - if: always() && inputs.suites
        name: Show the runner's free space and the guest drives' allocation
        run: |
          df -h / /mnt
          du -h /mnt/xnvme-fs/guest/xnvme_fs/*.img || true
      # publish-release attaches the reports of a release pull request's run to the release
      - if: always() && inputs.suites
        uses: actions/upload-artifact@v4
        with:
          name: verify-emulated-reports
          path: |
            /mnt/xnvme-fs/cijoe-output-build
            /mnt/xnvme-fs/cijoe-output
            /mnt/xnvme-fs/guest/xnvme_fs/serial.output
          if-no-files-found: ignore
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
