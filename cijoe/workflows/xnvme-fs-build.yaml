---
doc: |
  Build xNVMe, xnvme fs and the adapters on this machine, for workflows/xnvme-fs-guest.yaml to test.

  The step xnvme_fs_build builds in XNVME_FS_TREE. It builds xNVMe from the checkout that XNVME_FS_XNVME names, by
  default ~/git/xnvme, which must be on the branch api-pass of safl/xnvme, and installs it into a prefix in the
  tree. It builds xnvme fs from this checkout and installs it into the same prefix. Against that prefix it builds
  DuckDB with the extension and its tests, and RocksDB with the plugin.

  The machine needs xNVMe's dependencies and the packages that adapters/scripts/ci-deps.sh installs. xNVMe's image
  for Ubuntu 26.04 has both once ci-deps.sh has run in it. workflows/xnvme-fs-guest.yaml then runs the tests in the
  guest of xnvme-devenv. docs/reproducing.md has the commands of both workflows.

steps:
- name: build
  uses: xnvme_fs_build
